{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="text-center py-20">
  <div class="text-6xl font-black text-slsu-800">{{ code }}</div>
  <p class="mt-3 text-slate-600">{{ message }}</p>
  <a href="{{ url_for('index') }}" class="inline-block mt-6 px-5 py-2.5 bg-slsu-700 text-white rounded-lg font-semibold hover:bg-slsu-800">Go Home</a>
</div>
{% endblock %}
