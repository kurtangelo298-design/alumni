{% extends "base.html" %}
{% block title %}Login · SLSU-JGE Alumni{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-white rounded-2xl border border-slate-200 shadow-lg p-8">
    <h1 class="text-2xl font-bold text-slsu-700 text-center">Alumni Login</h1>
    <p class="text-sm text-slate-500 text-center mt-1">Approved alumni and administrators</p>
    <form method="post" class="mt-6 space-y-4">
      <div>
        <label class="text-sm font-semibold text-slate-700">Email</label>
        <input name="email" type="email" required class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-slsu-600 outline-none">
      </div>
      <div>
        <label class="text-sm font-semibold text-slate-700">Password</label>
        <input name="password" type="password" required class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-slsu-600 outline-none">
      </div>
      <button class="w-full py-2.5 bg-slsu-700 text-white rounded-lg font-semibold hover:bg-slsu-600">Sign In</button>
    </form>
    <p class="text-sm text-center text-slate-500 mt-5">No account yet? <a href="{{ url_for('register') }}" class="text-slsu-700 font-semibold hover:underline">Register here</a></p>
    <!-- [v3] demo/admin credentials removed from the login form -->
  </div>
</div>
{% endblock %}
