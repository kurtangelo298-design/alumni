{% extends "base.html" %}
{% block title %}Login · SLSU-JGE Alumni{% endblock %}
{% block content %}
<div class="max-w-md mx-auto animate-fade-in-up">
  <div class="bg-white rounded-2xl border border-slate-200 shadow-xl p-8 card-hover">
    <div class="text-center animate-scale-in">
      <div class="w-16 h-16 mx-auto rounded-full bg-slsu-700 text-white flex items-center justify-center text-2xl font-bold animate-float">S</div>
      <h1 class="text-2xl font-bold text-slsu-800 mt-3">Alumni Login</h1>
      <p class="text-sm text-slate-500 mt-1">Approved alumni and administrators</p>
    </div>
    <form method="post" class="mt-6 space-y-4">
      <div class="animate-fade-in-up delay-1">
        <label class="text-sm font-semibold text-slate-700">Email</label>
        <input name="email" type="email" required autocomplete="email"
               class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-slsu-600 focus:border-slsu-600 outline-none">
      </div>
      <div class="animate-fade-in-up delay-2">
        <label class="text-sm font-semibold text-slate-700">Password</label>
        <input name="password" type="password" required autocomplete="current-password"
               class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-slsu-600 focus:border-slsu-600 outline-none">
      </div>
      <button class="w-full py-2.5 bg-slsu-700 text-white rounded-lg font-semibold hover:bg-slsu-800 btn-press animate-fade-in-up delay-3 shadow-lg shadow-slsu-700/30">
        Sign In
      </button>
    </form>
    <p class="text-sm text-center text-slate-500 mt-5 animate-fade-in-up delay-4">
      No account yet? <a href="{{ url_for('register') }}" class="text-slsu-700 font-semibold hover:underline">Register here</a>
    </p>
    <!-- [REMOVED v3] Demo accounts box — admin credentials are no longer visible to the public -->
  </div>
</div>
{% endblock %}
