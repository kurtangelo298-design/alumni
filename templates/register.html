{% extends "base.html" %}
{% block title %}Register · SLSU-JGE Alumni{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto animate-fade-in-up">
  <div class="bg-white rounded-2xl border border-slate-200 shadow-xl p-8 card-hover">
    <h1 class="text-2xl font-bold text-slsu-800 text-center">Alumni Registration</h1>
    <p class="text-sm text-slate-500 text-center mt-1">Your details are automatically verified against the university's master graduate list.</p>

    <!-- [NEW v3] Profile picture upload with live preview -->
    <div class="mt-6 flex flex-col items-center animate-scale-in">
      <label class="cursor-pointer group relative">
        <div id="pic-preview" class="w-24 h-24 rounded-full bg-slsu-100 border-2 border-dashed border-slsu-400 flex items-center justify-center text-slsu-500 overflow-hidden group-hover:border-slsu-600 transition-colors">
          <span class="text-3xl">+</span>
        </div>
        <span class="absolute bottom-0 right-0 bg-slsu-700 text-white text-xs rounded-full w-7 h-7 flex items-center justify-center shadow">📷</span>
        <input type="file" name="profile_pic" accept="image/*" class="hidden" id="profile_pic_input" onchange="previewPic(this)">
      </label>
      <p class="text-xs text-slate-400 mt-2">Profile picture (optional) · JPG/PNG/GIF/WEBP · max 5MB</p>
    </div>

    <form method="post" enctype="multipart/form-data" class="mt-6 grid md:grid-cols-2 gap-4">
      <div class="animate-fade-in-up delay-1">
        <label class="text-sm font-semibold text-slate-700">Full Name *</label>
        <input name="full_name" id="full_name" value="{{ form.full_name or '' }}" required
               class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-slsu-600 focus:border-slsu-600 outline-none">
      </div>
      <div class="animate-fade-in-up delay-1">
        <label class="text-sm font-semibold text-slate-700">Student Number *</label>
        <input name="student_number" id="student_number" value="{{ form.student_number or '' }}" required placeholder="e.g. 2018-0001"
               class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-slsu-600 focus:border-slsu-600 outline-none">
      </div>
      <div class="animate-fade-in-up delay-2">
        <label class="text-sm font-semibold text-slate-700">Department / College</label>
        <select name="department" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-slsu-600 focus:border-slsu-600 outline-none">
          <option value="">Select department</option>
          {% for d in depts %}<option value="{{ d }}" {% if form.department == d %}selected{% endif %}>{{ d }}</option>{% endfor %}
        </select>
      </div>
      <div class="animate-fade-in-up delay-2">
        <label class="text-sm font-semibold text-slate-700">Year Graduated *</label>
        <input name="year_graduated" id="year_graduated" type="number" value="{{ form.year_graduated or '' }}" required
               class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-slsu-600 focus:border-slsu-600 outline-none">
      </div>
      <div class="animate-fade-in-up delay-3">
        <label class="text-sm font-semibold text-slate-700">Email *</label>
        <input name="email" type="email" value="{{ form.email or '' }}" required
               class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-slsu-600 focus:border-slsu-600 outline-none">
      </div>
      <div class="animate-fade-in-up delay-3">
        <label class="text-sm font-semibold text-slate-700">Contact Number</label>
        <input name="contact" value="{{ form.contact or '' }}"
               class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-slsu-600 focus:border-slsu-600 outline-none">
      </div>
      <div class="animate-fade-in-up delay-4">
        <label class="text-sm font-semibold text-slate-700">Password * (min 6 chars)</label>
        <input name="password" type="password" required
               class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-slsu-600 focus:border-slsu-600 outline-none">
      </div>
      <div class="animate-fade-in-up delay-4">
        <label class="text-sm font-semibold text-slate-700">Confirm Password *</label>
        <input name="confirm" type="password" required
               class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-slsu-600 focus:border-slsu-600 outline-none">
      </div>
      <!-- [NEW v3] Bio field -->
      <div class="md:col-span-2 animate-fade-in-up delay-4">
        <label class="text-sm font-semibold text-slate-700">Bio / About Yourself (optional)</label>
        <textarea name="bio" rows="2" placeholder="Tell us something about yourself..."
                  class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-slsu-600 focus:border-slsu-600 outline-none resize-none">{{ form.bio or '' }}</textarea>
      </div>
      <div class="md:col-span-2 animate-fade-in-up delay-4">
        <div id="verify-status" class="hidden text-sm rounded-lg px-4 py-3"></div>
      </div>
      <div class="md:col-span-2 animate-fade-in-up delay-5">
        <button class="w-full py-2.5 bg-slsu-700 text-white rounded-lg font-semibold hover:bg-slsu-800 btn-press shadow-lg shadow-slsu-700/30">Submit Registration</button>
      </div>
    </form>
  </div>
</div>
<script>
// [NEW v3] Live profile picture preview
function previewPic(input){
  if(input.files && input.files[0]){
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('pic-preview').innerHTML =
        `<img src="${e.target.result}" class="w-full h-full object-cover rounded-full">`;
    };
    reader.readAsDataURL(input.files[0]);
  }
}
// Live verification check
const fields = ['full_name','student_number','year_graduated'];
fields.forEach(id => { const el = document.getElementById(id); if(el) el.addEventListener('input', check); });
async function check(){
  const name = document.getElementById('full_name').value.trim();
  const sn = document.getElementById('student_number').value.trim();
  const yr = document.getElementById('year_graduated').value.trim();
  const box = document.getElementById('verify-status');
  if(!name || !sn || !yr){ box.classList.add('hidden'); return; }
  const r = await fetch(`/api/verify?name=${encodeURIComponent(name)}&student_number=${encodeURIComponent(sn)}&year=${encodeURIComponent(yr)}`);
  const data = await r.json();
  box.classList.remove('hidden','bg-green-50','text-green-800','border','border-green-300','bg-amber-50','text-amber-800','border-amber-300');
  if(data.verified){
    box.className = 'text-sm rounded-lg px-4 py-3 bg-green-50 text-green-800 border border-green-300 animate-fade-in';
    box.textContent = '✓ Record found in the master graduate list. You will be auto-verified on submit.';
  } else {
    box.className = 'text-sm rounded-lg px-4 py-3 bg-amber-50 text-amber-800 border border-amber-300 animate-fade-in';
    box.textContent = '⚠ No exact match found yet. Your registration will be saved and manually reviewed by an administrator.';
  }
}
</script>
{% endblock %}
